var WD=['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
function iso(d){d=d||new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function pIso(s){var p=String(s||'').split('-');if(p.length!==3)return new Date();return new Date(+p[0],(+p[1])-1,+p[2])}
function dur(n){n=Math.max(0,Math.round(+n||0));var T=T0(),st=new Date(T.getFullYear(),T.getMonth(),T.getDate()-n),mo=(T.getFullYear()-st.getFullYear())*12+T.getMonth()-st.getMonth();if(cdate(st.getFullYear(),st.getMonth()+mo,st.getDate())>T)mo--;if(mo<0)mo=0;var d=dd(cdate(st.getFullYear(),st.getMonth()+mo,st.getDate()),T);return mo>0?toBn(mo)+' মাস'+(d>0?' '+toBn(d)+' দিন':''):toBn(d)+' দিন'}
function fD(s){if(!s)return '';var p=String(s).split('-');return p.length===3?toBn(p[2]+'/'+p[1]+'/'+p[0]):esc(s)}
function cdate(y,m,day){var r=new Date(y,m,1),last=new Date(r.getFullYear(),r.getMonth()+1,0).getDate();r.setDate(Math.min(day,last));return r}
function T0(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function dd(a,b){return Math.round((b-a)/864e5)}
function mon(n){return '৳ '+toBn(Number(Math.round((+n||0)*100)/100).toLocaleString('en-IN',{maximumFractionDigits:2}))}
function rd(n){return Math.round((+n||0)*100)/100}
function val(id){var e=gid(id);return e?e.value:''}
function nv(id){return Math.max(0,+toEn(val(id)||'0')||0)}
function nid(k){DB.nxt=DB.nxt||{};DB.nxt[k]=(DB.nxt[k]||0)+1;return DB.nxt[k]}
function mem(id){return DB.members.find(function(m){return m.id===id})}
function loanOf(id){return DB.loans.find(function(l){return l.id===id})}
function getRem(){return Number(getSet().remDays)||3}
function xBtn(h){return '<button class="m-x" onclick="closeM(\''+h+'\')"><i class="fas fa-times"></i></button>'}
function normPhone(p){var d=toEn(String(p||'')).replace(/[^0-9]/g,'');if(d.indexOf('880')===0)return d;if(d.charAt(0)==='0')return '88'+d;if(d.length===10&&d.charAt(0)==='1')return '880'+d;return d}
function fmtAmt(n){return toBn(String(Math.round((+n||0)*100)/100))}

/* ── সঞ্চয় ── */
function mSav(mid){var dep=0,wd=0,adj=0;DB.savings.forEach(function(t){if(t.mid!==mid)return;if(t.type==='deposit')dep+=t.amt;else if(t.type==='withdraw')wd+=t.amt;else if(t.type==='loanadj')adj+=t.amt});return{dep:rd(dep),wd:rd(wd),adj:rd(adj),bal:rd(dep-wd-adj)}}
function sType(m){return m.saveType==='d'||m.saveType==='w'?m.saveType:'m'}
function sLbl(m){var t=sType(m);return t==='d'?'দৈনিক':t==='w'?'সাপ্তাহিক':'মাসিক'}
function sFirst(m){var j=pIso(m.joinDate);if(sType(m)==='w'){var wd=(m.saveWday==null||m.saveWday==='')?j.getDay():+m.saveWday;return new Date(j.getFullYear(),j.getMonth(),j.getDate()+((wd-j.getDay()+7)%7))}return j}
function sWhen(m){var t=sType(m);return t==='d'?'প্রতিদিন':t==='w'?'প্রতি '+WD[sFirst(m).getDay()]:'প্রতি মাসের '+toBn(m.saveDay||pIso(m.joinDate).getDate())+' তারিখে'}
function sLead(m){var t=sType(m);return t==='m'?getRem():(t==='w'?1:-1)}
function sDue(m,k){var t=sType(m);if(t==='d'){var j0=pIso(m.joinDate);return new Date(j0.getFullYear(),j0.getMonth(),j0.getDate()+k)}
if(t==='w'){var f=sFirst(m);return new Date(f.getFullYear(),f.getMonth(),f.getDate()+7*k)}
var j=pIso(m.joinDate),day=Math.min(31,Math.max(1,+m.saveDay||j.getDate()));var d=cdate(j.getFullYear(),j.getMonth(),day);if(d<j)k++;return cdate(j.getFullYear(),j.getMonth()+k,day)}
function sCount(m,T){var t=sType(m);if(t==='d')return Math.max(0,dd(pIso(m.joinDate),T)+1);if(t==='w'){var f=sFirst(m);return f>T?0:Math.floor(dd(f,T)/7)+1}var n=0;while(n<720&&sDue(m,n)<=T)n++;return n}
function sStat(m,T){var amt=+m.saveAmt||0;if(!(amt>0)||m.status!=='active')return null;
var s=mSav(m.id).dep,cov=Math.floor((s+0.005)/amt),n=sCount(m,T);
var r={amt:amt,arr:0,days:0,nd:null,nin:null};
if(n>cov){r.arr=rd(n*amt-s);r.days=dd(sDue(m,cov),T)}
var u=Math.max(cov,n);r.nd=sDue(m,u);r.nin=dd(T,r.nd);return r}

/* ── লোন ও লাভ ── */
function lPaid(l){var a=0,b=0,c=0,wp=0,wf=0;(l.pays||[]).forEach(function(p){a+=p.principal||0;if(p.via==='waive'){wp+=p.principal||0;wf+=p.profit||0;return}b+=p.profit||0;c+=p.fine||0});return{prin:rd(a),prof:rd(b),fine:rd(c),wvP:rd(wp),wvF:rd(wf),wv:rd(wp+wf)}}
function lDue(l,k){var s=pIso(l.date);return cdate(s.getFullYear(),s.getMonth()+k,s.getDate())}
function lBefore(l,k){var p=0;(l.pays||[]).forEach(function(x){if((x.k||1)<k)p+=x.principal||0});return rd(l.amount-p)}
function lPD(l,k){return rd((+l.rate||0)/100*Math.max(0,lBefore(l,k)))}
function lPP(l,k){var a=0;(l.pays||[]).forEach(function(x){if((x.k||1)===k)a+=x.profit||0});return rd(a)}
function lStat(l,T){var pd=lPaid(l),prin=rd(l.amount-pd.prin),r={prin:prin,paid:pd,arr:0,days:0,fk:null,last:null,sl:null,nk:null,nd:null,nin:null,nAmt:0,open:prin>0.004,term:0};
var k=1;while(k<720&&lDue(l,k)<=T){var due=lPD(l,k),pp=lPP(l,k);if(due-pp>0.004){r.arr=rd(r.arr+due-pp);if(r.fk==null)r.fk=k}k++}
if(r.fk!=null)r.days=dd(lDue(l,r.fk),T);
r.nk=k;r.nd=lDue(l,k);r.nin=dd(T,r.nd);r.nAmt=Math.max(0,rd(lPD(l,k)-lPP(l,k)));
(l.pays||[]).forEach(function(p){if((p.via==='saving'||p.via==='waive'))return;var d=pIso(p.date);if(!r.last||d>r.last)r.last=d});
r.sl=dd(r.last||pIso(l.date),T);
if(+l.months>0){var end=lDue(l,+l.months);if(r.open&&T>end)r.term=dd(end,T)}
return r}
function defK(l){var pd=lPaid(l);if(l.amount-pd.prin<=0.004)return null;
if(!(+l.rate>0)){var mk=0;(l.pays||[]).forEach(function(x){mk=Math.max(mk,x.k||1)});return Math.max(1,mk)}
for(var k=1;k<720;k++){if(lPD(l,k)-lPP(l,k)>0.004)return k}return 1}
function mLoans(mid){return DB.loans.filter(function(l){return l.mid===mid})}
function mLoanBal(mid){var T=T0(),s=0;mLoans(mid).forEach(function(l){s+=lStat(l,T).prin});return rd(s)}
function mLoanArr(mid){var T=T0(),a=0,d=0;mLoans(mid).forEach(function(l){var q=lStat(l,T);if(q.open&&q.arr>0){a+=q.arr;d=Math.max(d,q.days)}});return{arr:rd(a),days:d}}

function alerts(){var T=T0(),rem=getRem(),a=[];
DB.members.forEach(function(m){var s=sStat(m,T);if(!s)return;
if(s.arr>0)a.push({mid:m.id,kind:'sav',t:'over',amt:s.arr,days:s.days,date:null,ord:-s.days});
else if(s.nin<=sLead(m))a.push({mid:m.id,kind:'sav',t:'soon',amt:s.amt,days:s.nin,date:s.nd,ord:s.nin})});
DB.loans.forEach(function(l){if(!mem(l.mid))return;var q=lStat(l,T);if(!q.open)return;
if(q.arr>0)a.push({mid:l.mid,lid:l.id,kind:'loan',t:'over',amt:q.arr,days:q.days,date:null,ord:-q.days});
else if(q.nin<=rem&&q.nAmt>0)a.push({mid:l.mid,lid:l.id,kind:'loan',t:'soon',amt:q.nAmt,days:q.nin,date:q.nd,ord:q.nin})});
a.sort(function(x,y){return x.ord-y.ord});return a}

var IMGDB=null;
function idb(){return new Promise(function(res,rej){if(IMGDB)return res(IMGDB);if(!window.indexedDB)return rej();var r=indexedDB.open('smtimg',1);r.onupgradeneeded=function(){r.result.createObjectStore('i')};r.onsuccess=function(){IMGDB=r.result;res(IMGDB)};r.onerror=function(){rej()}})}
function idbGet(k){return idb().then(function(d){return new Promise(function(res){var q=d.transaction('i').objectStore('i').get(k);q.onsuccess=function(){res(q.result||null)};q.onerror=function(){res(null)}})}).catch(function(){return null})}
function idbPut(k,v){return idb().then(function(d){return new Promise(function(res){var q=d.transaction('i','readwrite').objectStore('i').put(v,k);q.onsuccess=function(){res(true)};q.onerror=function(){res(false)}})}).catch(function(){return false})}
function idbDel(k){return idb().then(function(d){return new Promise(function(res){var q=d.transaction('i','readwrite').objectStore('i').delete(k);q.onsuccess=function(){res(true)};q.onerror=function(){res(false)}})}).catch(function(){return false})}
function idbPending(){return idb().then(function(d){return new Promise(function(res){var out=[],q=d.transaction('i').objectStore('i').openCursor();q.onsuccess=function(){var c=q.result;if(c){if(c.value&&c.value.p)out.push([c.key,c.value]);c.continue()}else res(out)};q.onerror=function(){res(out)}})}).catch(function(){return []})}
function imgRef(key){var u=fbCur();return u&&fbDb?fbDb.collection('samity').doc(u.uid).collection('img').doc(key):null}
function imgFlush(key,d){var r=imgRef(key);if(!r||navigator.onLine===false)return Promise.resolve(false);return r.set({d:d,t:Date.now()}).then(function(){return idbPut(key,{d:d})}).then(function(){return true},function(){return false})}
function imgSave(key,d){return idbPut(key,{d:d,p:1}).then(function(){return imgFlush(key,d)})}
function imgLoad(key){return idbGet(key).then(function(v){if(v&&v.d)return v.d;var r=imgRef(key);if(!r||navigator.onLine===false)return null;return r.get().then(function(s){if(s.exists&&s.data().d){idbPut(key,{d:s.data().d});return s.data().d}return null},function(){return null})})}
function imgDrop(key){idbDel(key);var r=imgRef(key);if(r&&navigator.onLine!==false)r.delete().catch(function(){})}
function imgFlushAll(){if(!lsGet('smtTok')||navigator.onLine===false)return;idbPending().then(function(l){l.forEach(function(x){imgFlush(x[0],x[1].d)})})}
function shrink(file,max,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.72))};im.onerror=function(){toast('err','ছবি পড়া যায়নি')};im.src=r.result};r.onerror=function(){toast('err','ছবি পড়া যায়নি')};r.readAsDataURL(file)}
function capImg(cam,max,cb){var i=document.createElement('input');i.type='file';i.accept='image/*';if(cam)i.setAttribute('capture',cam);i.onchange=function(){var f=i.files&&i.files[0];if(f)shrink(f,max,cb)};i.click()}

function dayStats(ds){var r={sav:0,prof:0,prin:0,fine:0,loan:0,wd:0,ex:0};
DB.savings.forEach(function(t){if(t.date!==ds)return;if(t.type==='deposit')r.sav+=t.amt;else if(t.type==='withdraw')r.wd+=t.amt});
DB.loans.forEach(function(l){if(l.date===ds)r.loan+=l.amount;(l.pays||[]).forEach(function(p){if(p.date!==ds||(p.via==='saving'||p.via==='waive'))return;r.prof+=p.profit||0;r.prin+=p.principal||0;r.fine+=p.fine||0})});
DB.expenses.forEach(function(e){if(e.date===ds)r.ex+=e.amt});FN().forEach(function(f){if(f.date===ds)r.fine+=f.amt});
r.inc=rd(r.sav+r.prof+r.prin+r.fine);r.out=rd(r.loan+r.wd+r.ex);r.net=rd(r.inc-r.out);return r}

function exitCalc(id){var T=T0(),sv=mSav(id).bal,prin=0,arr=0;mLoans(id).forEach(function(l){var q=lStat(l,T);if(q.open){prin+=q.prin;arr+=q.arr}});prin=rd(prin);arr=rd(arr);var D=rd(prin+arr),adj=Math.min(sv,D);return{sv:sv,prin:prin,arr:arr,D:D,adj:adj,refund:rd(sv-adj),left:rd(D-adj)}}

function initSUM(){var now=new Date(),cm=now.getMonth(),cy=now.getFullYear(),mo='',yo='';for(var i=0;i<12;i++)mo+='<option value="'+i+'"'+(i===cm?' selected':'')+'>'+MONTHS[i]+'</option>';for(var y=cy-3;y<=cy+1;y++)yo+='<option value="'+y+'"'+(y===cy?' selected':'')+'>'+toBn(y)+'</option>';

function renderSUM(){var m=+val('sumM'),y=+val('sumY'),mk=y+'-'+('0'+(m+1)).slice(-2),r={sav:0,prof:0,prin:0,fine:0,loan:0,wd:0,ex:0};

DB.loans.forEach(function(l){if(String(l.date).slice(0,7)===mk)r.loan+=l.amount;(l.pays||[]).forEach(function(p){if(String(p.date).slice(0,7)!==mk||(p.via==='saving'||p.via==='waive'))return;r.prof+=p.profit||0;r.prin+=p.principal||0;r.fine+=p.fine||0})});
DB.expenses.forEach(function(e){if(String(e.date).slice(0,7)===mk)r.ex+=e.amt});FN().forEach(function(f){if(String(f.date).slice(0,7)===mk)r.fine+=f.amt});
var inn=rd(r.sav+r.prof+r.prin+r.fine),out=rd(r.loan+r.wd+r.ex),net=rd(inn-out);
var c=function(l,v,col){return '<div class="sum-stat-item"><div class="ss-val" style="color:'+(col||'var(--tp)')+'">'+mon(v)+'</div><div class="ss-lbl">'+l+'</div></div>'};
var h='<div class="sum-stat" style="grid-template-columns:1fr 1fr">'+c('সঞ্চয় জমা',r.sav,'var(--grn)')+c('লাভ আদায়',r.prof,'var(--grn)')+c('আসল আদায়',r.prin,'var(--grn)')+c('জরিমানা',r.fine,'var(--grn)')+c('লোন দেওয়া',r.loan,'var(--red)')+c('সঞ্চয় ফেরত',r.wd,'var(--red)')+c('খরচ',r.ex,'var(--red)')+c('মাসের জের (আদায় − প্রদান)',net,net>=0?'var(--grn)':'var(--red)')+'</div>';
var T=T0(),totS=0,totL=0,cash=0;DB.members.forEach(function(x){totS+=mSav(x.id).bal});DB.loans.forEach(function(l){totL+=lStat(l,T).prin;cash-=l.amount;(l.pays||[]).forEach(function(p){if(p.via!=='saving'&&p.via!=='waive')cash+=(p.principal||0)+(p.profit||0)+(p.fine||0)})});DB.savings.forEach(function(t){if(t.type==='deposit')cash+=t.amt;else if(t.type==='withdraw')cash-=t.amt});DB.expenses.forEach(function(e){cash-=e.amt});FN().forEach(function(f){cash+=f.amt});
h+='<div class="sum-stat" style="grid-template-columns:1fr 1fr">'+c('মোট সঞ্চয় (এখন)',totS,'var(--grn)')+c('লোন বাকি আসল (এখন)',totL,'var(--red)')+c('হিসাব অনুযায়ী নগদ',cash)+'</div><p class="st-note">"হিসাব অনুযায়ী নগদ" অ্যাপে লেখা সব জমা, লোন, ফেরত ও খরচ থেকে হিসাব করা। সমিতির শুরুর পুঁজি এতে ধরা নেই।</p>';
var od=[];DB.members.forEach(function(x){var s=sStat(x,T);if(s&&s.arr>0)od.push({m:x,w:'সঞ্চয়',a:s.arr,d:s.days})});DB.loans.forEach(function(l){var q=lStat(l,T),x=mem(l.mid);if(x&&q.open&&q.arr>0)od.push({m:x,w:'লোনের লাভ',a:q.arr,d:q.days})});od.sort(function(a,b){return b.d-a.d});

if(!od.length)h+='<p class="empty-msg">কারও কিছু বাকি নেই</p>';else{h+='<table><thead><tr><th>সদস্য</th><th>কিসের</th><th>বাকি</th><th>কত দিন</th></tr></thead><tbody>';od.forEach(function(o){h+='<tr><td><span class="t-name" onclick="oMD('+o.m.id+')">'+esc(o.m.name)+'</span></td><td>'+o.w+'</td><td class="t-num" style="color:var(--red)">'+mon(o.a)+'</td><td>'+dur(o.d)+'</td></tr>'});h+='</tbody></table>'}
